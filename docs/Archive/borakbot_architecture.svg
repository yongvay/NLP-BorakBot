<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" width="1120" height="1000">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a6a52"/>
    </marker>
  </defs>

  <style>
    text { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; fill: #1b2430; }
    .ttl  { font-size: 21px; font-weight: 700; }
    .sub  { font-size: 13px; fill: #55616f; }
    .hd   { font-size: 15px; font-weight: 700; }
    .hdm  { font-size: 13px; font-weight: 400; fill: #55616f; }
    .bd   { font-size: 12.5px; }
    .bdm  { font-size: 12px; fill: #55616f; }
    .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11.5px; }
    .cap  { font-size: 12px; fill: #55616f; }
    .flow { stroke: #1b2430; stroke-width: 1.6; fill: none; marker-end: url(#arw); }
    .dash { stroke: #7a6a52; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arwd); }
    .boxR { fill: #eaf0f8; stroke: #3c6098; stroke-width: 1.6; }
    .boxI { fill: #ffffff; stroke: #9db6d4; stroke-width: 1.2; }
    .boxO { fill: #f7f1e6; stroke: #96703a; stroke-width: 1.4; }
    .boxG { fill: #e9f3ec; stroke: #457a55; stroke-width: 1.6; }
    .boxF { fill: #f6ecf1; stroke: #8a4f6d; stroke-width: 1.6; }
    .panel{ fill: #fdfaf4; stroke: #d8c8ac; stroke-width: 1.2; stroke-dasharray: 4 3; }
  </style>

  <rect width="1120" height="1000" fill="#ffffff"/>

  <text class="ttl" x="32" y="38">BorakBot — four-stage system architecture</text>
  <text class="sub" x="32" y="60">Solid arrows: runtime data flow.  Dashed: offline preparation and the moderated correction loop — neither runs at inference.</text>

  <!-- ============ OFFLINE PANEL ============ -->
  <rect class="panel" x="668" y="162" width="364" height="524" rx="8"/>
  <text class="hd" x="686" y="187">Offline preparation</text>

  <rect class="boxO" x="686" y="200" width="328" height="62" rx="5"/>
  <text class="bd" x="700" y="221">data/knowledge_base/*.yaml</text>
  <text class="bdm" x="700" y="240">5 domains · 54 hand-verified facts,</text>
  <text class="bdm" x="700" y="255">each with a source and stability marker</text>
  <path class="dash" d="M 850 262 L 850 278"/>

  <rect class="boxO" x="686" y="282" width="328" height="62" rx="5"/>
  <text class="bd" x="700" y="303">Corpus generation</text>
  <text class="bdm" x="700" y="322">committed prompt → validate_pairs.py</text>
  <text class="bdm" x="700" y="337">→ build_corpus.py (gate + provenance)</text>
  <path class="dash" d="M 850 344 L 850 360"/>

  <rect class="boxO" x="686" y="364" width="328" height="66" rx="5"/>
  <text class="bd" x="700" y="385">pairs_v1.jsonl — 632 pairs</text>
  <text class="bdm" x="700" y="404">502 answered from the 54 facts</text>
  <text class="bdm" x="700" y="420">130 refusals, 5 out-of-scope kinds</text>
  <path class="dash" d="M 850 430 L 850 446"/>

  <rect class="boxO" x="686" y="450" width="328" height="52" rx="5"/>
  <text class="bd" x="700" y="471">Pair-level split — 506 / 63 / 63</text>
  <text class="bdm" x="700" y="490">paraphrase robustness, not new knowledge</text>
  <path class="dash" d="M 850 502 L 850 518"/>

  <rect class="boxO" x="686" y="522" width="328" height="62" rx="5"/>
  <text class="bd" x="700" y="543">QLoRA fine-tune — Google Colab T4</text>
  <text class="bdm" x="700" y="562">4-bit NF4, rank 16 / alpha 32, 5 epochs</text>
  <text class="bdm" x="700" y="577">160 steps · 45 minutes</text>
  <path class="dash" d="M 850 584 L 850 600"/>

  <rect class="boxO" x="686" y="604" width="328" height="58" rx="5"/>
  <text class="bd" x="700" y="625">Adapter — borakbot-qlora-r1</text>
  <text class="bdm" x="700" y="644">~24 MB, on top of the frozen base</text>

  <!-- adapter feeds Stage 3 -->
  <path class="dash" d="M 686 633 L 662 633 L 662 563 L 644 563"/>

  <!-- ============ RUNTIME SPINE ============ -->
  <rect class="boxG" x="32" y="76" width="606" height="62" rx="5"/>
  <text class="hd" x="48" y="100">User input — Streamlit chat interface</text>
  <text class="bdm" x="48" y="122">recorded or uploaded audio (WAV / MP3 / M4A / OGG / …)  ·  typed rojak text</text>
  <path class="flow" d="M 335 138 L 335 158"/>

  <!-- STAGE 1 -->
  <rect class="boxR" x="32" y="162" width="606" height="176" rx="5"/>
  <text class="hd" x="48" y="186">Stage 1 · Speech-to-text <tspan class="hdm">app/stt.py</tspan></text>

  <rect class="boxI" x="48" y="196" width="278" height="82" rx="4"/>
  <text class="bd" x="60" y="216">Language identification</text>
  <text class="mono" x="60" y="235">openai/whisper-small</text>
  <text class="bdm" x="60" y="253">one encoder pass, unbiased;</text>
  <text class="bdm" x="60" y="268">returns p_en</text>

  <rect class="boxI" x="344" y="196" width="278" height="82" rx="4"/>
  <text class="bd" x="356" y="216">Transcription</text>
  <text class="mono" x="356" y="235">malaysian-whisper-small-v3</text>
  <text class="bdm" x="356" y="253">code-switched decoder prompt</text>
  <text class="bdm" x="356" y="268">supplied as context</text>

  <path class="flow" d="M 326 237 L 338 237"/>

  <text class="bd" x="48" y="299">Routing: choose &#39;en&#39; only if argmax = en and p_en &gt; 0.5, otherwise &#39;ms&#39; — asymmetric</text>
  <text class="bdm" x="48" y="322">Pinned to CPU so Stage 3 keeps the GPU  ·  corpus WER 0.349 strict / 0.339 lenient</text>
  <path class="flow" d="M 335 338 L 335 358"/>

  <!-- STAGE 2 -->
  <rect class="boxR" x="32" y="362" width="606" height="90" rx="5"/>
  <text class="hd" x="48" y="386">Stage 2 · Transcription repair <tspan class="hdm">app/normalise.py</tspan></text>
  <text class="bd" x="48" y="410">17-entry repair table: only tokens Whisper invents that exist in neither language</text>
  <text class="bdm" x="48" y="432">Register, capitalisation and punctuation left untouched — the model was fitted on rojak</text>
  <path class="flow" d="M 335 452 L 335 472"/>

  <!-- STAGE 3 -->
  <rect class="boxR" x="32" y="476" width="606" height="174" rx="5"/>
  <text class="hd" x="48" y="500">Stage 3 · Knowledge-based generation <tspan class="hdm">app/inference.py</tspan></text>
  <text class="bdm" x="48" y="522">constrained system prompt (read from the knowledge base) + last 2 turns + utterance</text>

  <rect class="boxI" x="48" y="532" width="574" height="60" rx="4"/>
  <text class="mono" x="60" y="553">meta-llama/Llama-3.2-3B-Instruct</text>
  <text class="bdm" x="60" y="572">frozen, 4-bit NF4 + QLoRA adapter · greedy decoding · max 160 new tokens</text>

  <text class="bdm" x="48" y="612">Knowledge lives in the weights — there is no retrieval step at inference</text>
  <text class="bdm" x="48" y="634">Refusal is trained, not filtered: 130 corpus pairs answer out-of-scope with the fallback</text>
  <path class="flow" d="M 335 650 L 335 670"/>

  <!-- REPLY -->
  <rect class="boxG" x="32" y="674" width="606" height="58" rx="5"/>
  <text class="hd" x="48" y="698">Rojak reply, or the trained fallback sentence</text>
  <text class="bdm" x="48" y="720">the interface reports the backend used and the latency for that reply</text>
  <path class="flow" d="M 335 732 L 335 752"/>

  <!-- STAGE 4 -->
  <rect class="boxF" x="32" y="756" width="606" height="110" rx="5"/>
  <text class="hd" x="48" y="780">Stage 4 · Feedback capture <tspan class="hdm">app/feedback.py</tspan></text>
  <text class="bd" x="48" y="804">Thumbs up / down on every reply; a negative verdict opens a correction field</text>
  <text class="bdm" x="48" y="826">Written to SQLite with the dialogue context, backend and latency</text>
  <text class="bdm" x="48" y="848">transcript and model input in separate columns — an ASR failure stays distinguishable</text>
  <path class="flow" d="M 335 866 L 335 886"/>

  <!-- ADMIN -->
  <rect class="boxF" x="32" y="890" width="606" height="72" rx="5"/>
  <text class="hd" x="48" y="914">Password-gated review page <tspan class="hdm">app/pages/1_Admin.py</tspan></text>
  <text class="bdm" x="48" y="936">Exports thumbs-down rows shaped like training pairs — shaped like one, not saved as one.</text>
  <text class="bdm" x="48" y="953">There is no retraining trigger and no write path into the training data.</text>

  <!-- moderated return loop -->
  <path class="dash" d="M 638 926 L 1078 926 L 1078 397 L 1018 397"/>
  <text class="cap" x="1064" y="770" transform="rotate(-90 1064 770)" text-anchor="middle">round 2 — only after human review</text>

  <text class="cap" x="32" y="988">Stage 1 is evaluated by Word Error Rate on 48 recorded clips; Stages 3 and 4 on a held-out split of 63 pairs. Speech errors are reported apart from generation errors.</text>
</svg>
